<!doctype html><html lang="ms"><meta charset="utf-8"><title>Ujian sijil dan cabaran ringkas</title><style>body{margin:0;background:#f1f5ee;font:14px monospace}pre{padding:16px;white-space:pre-wrap}iframe{width:100%;height:1000px;border:0}.visual pre{display:none}.visual iframe{height:100vh}</style><pre>RUNNING</pre><iframe title="Permainan ujian"></iframe><script>
(async()=>{
 const frame=document.querySelector('iframe'),out=document.querySelector('pre'),logs=[];let w,d;
 const check=(value,text)=>{if(!value)throw Error(text);logs.push('PASS '+text);out.textContent=logs.join('\n');};
 const load=()=>new Promise(resolve=>{frame.onload=()=>{w=frame.contentWindow;d=w.document;resolve();};frame.src='../index.html?refine='+Date.now();});
 const $=s=>d.querySelector(s),click=s=>$(s).click(),snap=()=>w.PulauDebug.snapshot().state;
 const replaceState=async state=>{await new Promise(resolve=>{frame.onload=resolve;frame.src='about:blank';});localStorage.setItem('labirin-pulau-v2',JSON.stringify(state));await load();};
 try{
  localStorage.removeItem('labirin-pulau-v2');localStorage.removeItem('pulau-set-counter');await load();await w.Maze.assetsReady;
  const allPrompts=[];
  for(let v=0;v<3;v++){
   const route=w.CAMPAIGN.makeSet(v),final=w.CAMPAIGN.makeFinalSet(v),prompts=[...route,...final].map(q=>q.prompt).concat(w.CAMPAIGN.orderPrompt);
   check(new Set(prompts).size===12,'Set '+v+' has twelve distinct assessed prompts');allPrompts.push(...route.map(q=>q.prompt),...final.map(q=>q.prompt));
   check(route.filter(q=>q.level===1).every(q=>q.cardText&&q.mechanic==='sort'&&!q.options.includes('TEMBAKAU')),'Evidence assesses risk, safe choice and adult help instead of repeating substance identification');
   check(final[0].images.length===2&&final[0].options[final[0].answer].toLowerCase().includes(final[0].images[0]),'Final pair matches first pictured material');
   for(const q of final)check(q.options.length===3&&q.answer>=0&&q.answer<3,'Final options remain aligned for set '+v);
  }
  check(new Set(allPrompts).size===33,'Three session banks use 33 different route and final prompts before cycling');
  check(w.CAMPAIGN.controlExercise.prompt!==w.LEARNING.exercise.prompt,'Control practice does not repeat the introductory safety question');
  for(let n=0;n<3;n++){const map=w.Maze.generate(n);check(map.solution.length===[19,23,27][n],'Stage '+n+' uses the shorter route');check(map.stations.length===3&&map.extras.length===3,'All learning stations and optional objects remain available');}
  // Simulate an existing session: attempted and custom content must remain stable.
  const old=snap();old.profile={name:'Nabilah',classroom:'2 Ceria',character:'Aini'};old.campaign.contentVersion=1;old.questionSet=w.CAMPAIGN.makeSet(0);old.questionSet[3]={...w.PULAU.questions[3],prompt:w.CAMPAIGN.sortPrompt,mechanic:'sort'};old.questionSet[4]={...w.PULAU.questions[4],prompt:w.CAMPAIGN.sortPrompt,mechanic:'sort'};old.questionSet[5]={...w.PULAU.questions[5],prompt:'Kad khas yang disediakan oleh guru.'};old.records=[{id:'bukti-1',prompt:w.CAMPAIGN.sortPrompt,correct:false,attempts:1}];delete old.finalQuestionSet;
  await replaceState(old);
  check(snap().questionSet[3].prompt===w.CAMPAIGN.sortPrompt,'An attempted question remains stable after update');
  check(!!snap().questionSet[4].cardText,'Unattempted old evidence is upgraded to the distinct task');
  check(snap().questionSet[5].prompt==='Kad khas yang disediakan oleh guru.','Unmarked custom teacher question survives migration');
  const finalSnapshot=JSON.stringify(snap().finalQuestionSet);await load();check(JSON.stringify(snap().finalQuestionSet)===finalSnapshot,'Final question set survives resume unchanged');
  const finished=snap();finished.completed=[0,1,2];finished.stars=120;finished.level=2;finished.tutorial=true;finished.campaign.finalDone=[0,1,2];finished.campaign.storySeen=[0,1,2,3];finished.campaign.claims={0:true,1:true,2:true};finished.levels.forEach(l=>{l.solved=[0,1,2];l.doors=[0,1,2];});await replaceState(finished);await w.Maze.assetsReady;
  const svg=w.Certificate.make(finished.profile,{stars:120,badges:3}),xml=new DOMParser().parseFromString(svg,'image/svg+xml');
  check(!xml.querySelector('parsererror'),'Certificate is valid standalone SVG');
  check(xml.querySelectorAll('image').length===2&&[...xml.querySelectorAll('image')].every(i=>i.getAttribute('href').startsWith('data:image/png;base64,')),'Both detective portraits are embedded for offline printing');
  check(svg.includes('NABILAH')&&svg.includes('2 Ceria')&&svg.includes('120 BINTANG'),'Certificate contains actual name, class and learning stars');
  check(svg.includes('SIJIL PENCAPAIAN')&&svg.includes('#ffd600')&&svg.includes('#2149d8'),'Certificate follows the white, blue and yellow reference design');
  check(!svg.includes('01:24')&&!svg.includes('SK 2.1'),'Certificate does not invent time or curriculum accreditation');
  const escaped=w.Certificate.make({name:'A&B <C>',classroom:'2 <Ceria>'});check(!new DOMParser().parseFromString(escaped,'image/svg+xml').querySelector('parsererror'),'Names and classes containing XML characters export safely');
  click('#resume');click('#preview-certificate');await $('.certificate-preview').decode();check($('.certificate-preview').naturalWidth===1400,'Certificate preview loads embedded illustrations');
  const visual=new URLSearchParams(location.search).get('visual');if(visual){document.body.className='visual';if(visual.includes('mobile'))frame.style.width='390px';document.body.dataset.result='visual';return;}
  frame.style.width='390px';await new Promise(r=>setTimeout(r,80));check(d.documentElement.scrollWidth<=390&&$('.certificate-preview').getBoundingClientRect().width<=390,'Certificate preview fits touch screens');
  const printed={};w.open=()=>({document:{write:html=>printed.html=html,close(){},querySelector:()=>printed},focus(){},print(){printed.called=true;}});click('#print-certificate');printed.onload();check(printed.html.includes('A4 landscape')&&printed.called,'Print action prepares an A4 landscape document and opens printing');
  let blob;w.URL.createObjectURL=b=>{blob=b;return 'blob:certificate-test';};w.URL.revokeObjectURL=()=>{};w.HTMLAnchorElement.prototype.click=function(){};click('#save-certificate');check((await blob.text()).includes('NABILAH'),'Preview downloads a self-contained certificate');
  out.textContent='ALL PASSED\n'+logs.join('\n');document.body.dataset.result='passed';
 }catch(e){out.textContent='FAILED\n'+logs.join('\n')+'\n'+e.stack;document.body.dataset.result='failed';}
})();</script></html>
