<!doctype html><html lang="ms"><meta charset="utf-8"><title>Ujian audio dan aset Pulau 3D</title><pre>RUNNING</pre><iframe title="Permainan ujian" style="width:100%;height:800px"></iframe><script>
(async()=>{const savedKeys=['pulau-cabaran-3d-v1','labirin-pulau-v2'].map(k=>[k,localStorage.getItem(k)]);const restore=()=>savedKeys.forEach(([k,v])=>v===null?localStorage.removeItem(k):localStorage.setItem(k,v));addEventListener('pagehide',restore);const frame=document.querySelector('iframe'),out=document.querySelector('pre'),logs=[],errors=[];let w,d;const check=(v,t)=>{if(!v)throw Error(t);logs.push('PASS '+t);out.textContent=logs.join('\n');};const wait=ms=>new Promise(r=>setTimeout(r,ms));const load=()=>new Promise(resolve=>{frame.onload=()=>{const ready=()=>{if(frame.contentWindow.Pulau3D){w=frame.contentWindow;d=w.document;w.addEventListener('error',e=>errors.push(e.message));w.cancelAnimationFrame(w.Pulau3D.world().frame);resolve();}else setTimeout(ready,30);};ready();};frame.src='../index.html?audio-test='+Date.now();});const $=s=>d.querySelector(s),click=s=>$(s).click();
try{localStorage.removeItem('pulau-cabaran-3d-v1');localStorage.removeItem('labirin-pulau-v2');await load();const catalog=w.LESSON.audioCatalog();check(catalog.length===122&&Object.keys(w.MALAY_AUDIO).length===122,'Exactly 122 current spoken texts');for(const t of catalog)check(!!w.MALAY_AUDIO[t.replace(/\s+/g,' ').trim()],'Recording mapped: '+t.slice(0,40));
w.Progress.state.profile={name:'Ujian Audio',classroom:'2 Ceria'};w.Progress.state.training=true;w.Progress.state.demos=[0,1,2];w.Progress.save();w.Pulau3D.start();w.cancelAnimationFrame(w.Pulau3D.world().frame);w.Pulau3D.enterStation(0);await $('[data-fallback]').decode();check($('[data-fallback]').naturalWidth>500,'Tobacco PNG really loads');$('[data-fallback]').dispatchEvent(new w.Event('error'));check($('[data-fallback]').hidden&&!$('[data-fallback]').nextElementSibling.hidden,'SVG fallback displays if material image fails');
click('[data-item-audio="1"]');await wait(150);check(w.Voice.last[0].text==='Pilihan B. Tembakau','Choice letter and spoken option match');check(w.Voice.player.src.endsWith(w.MALAY_AUDIO['Pilihan B. Tembakau']),'Exact bundled Malay option recording selected');check(!!$('.speaking'),'Spoken item is highlighted');const token=w.Voice.token;click('[data-item-audio="0"]');check(w.Voice.token>token&&w.Voice.last[0].text==='Pilihan A. Alkohol','New speech cancels old speech');click('[data-stop]');check(!w.Voice.playing&&w.Voice.player.paused,'Stop pauses recording');$('[data-volume]').value=35;$('[data-volume]').dispatchEvent(new w.Event('input'));check(w.Voice.volume===.35&&w.Progress.state.settings.volume===35,'Volume is applied and saved');
click('#leave-station');w.Pulau3D.enterStation(1);click('[data-item-audio="target-2"]');check(w.Voice.last[0].text===w.Progress.state.questions[4].targets[2],'Matching target speech remains aligned with visual target');click('#leave-station');w.Pulau3D.enterStation(2);const q=w.Progress.state.questions[8];check(!$('.modal').textContent.includes(q.cards.slice(0,4).join(' ')),'Target sentence not visible before submission');click('#listen-all');check(w.Voice.last.slice(2).map(x=>x.text).join('|')===[4,2,0,3,1].map(i=>q.cards[i]).join('|'),'Listen All reads displayed phrase order, not the answer order');check(!w.Voice.last.some(x=>x.text===q.explanation),'Listen All does not disclose target explanation');click('[data-stop]');click('[data-phrase="0"]');click('[data-phrase="1"]');click('#leave-station');await load();click('#resume');w.cancelAnimationFrame(w.Pulau3D.world().frame);w.Pulau3D.enterStation(2);check(w.Progress.state.answers.s3q1.draft.join(',')==='0,1'&&$('[data-phrase="0"]').disabled,'Sentence draft survives reload');
const recording=w.Voice.recording,voice=w.Voice.malayVoice;w.Voice.recording=async()=>false;w.Voice.malayVoice=()=>undefined;await w.Voice.speak({text:q.prompt});check(!w.Voice.playing&&w.Voice.status.includes('Teruskan membaca'),'Unavailable Malay voice allows text fallback');await w.Voice.speak({text:'Saya'});check(!w.Voice.playing&&w.Voice.status.includes('masih boleh membaca'),'Failed recording leaves readable activity usable');click('[data-phrase="2"]');click('[data-phrase="3"]');click('#check-answer');check(w.Progress.state.answers.s3q1.done,'Question remains completable after audio failure');w.Voice.recording=recording;w.Voice.malayVoice=voice;w.Voice.stop();
await w.Art.ready;const image=new w.Image();image.src='../assets/materials/alkohol.png';await image.decode();check(image.naturalWidth>500,'Alcohol PNG loads');const font=await w.document.fonts.load('16px Fredoka');check(font.length>0,'Bundled Fredoka font loads');
const context=new w.AudioContext();for(const path of Object.values(w.MALAY_AUDIO)){const response=await fetch('../'+path);if(!response.ok)throw Error('Audio HTTP '+response.status+' '+path);const data=await context.decodeAudioData(await response.arrayBuffer());check(data.duration>.2,'Browser decodes '+path.split('/').pop());}await context.close();check(errors.length===0,'No runtime errors');out.textContent='ALL PASSED\n'+logs.join('\n');document.body.dataset.result='passed';}catch(e){out.textContent='FAILED\n'+logs.join('\n')+'\n'+e.stack;document.body.dataset.result='failed';}finally{frame.remove();restore();}})();</script></html>
