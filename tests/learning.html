<!doctype html><html lang="ms"><meta charset="utf-8"><title>Ujian pembelajaran Pulau Cabaran</title><style>body{margin:0;font:14px monospace;background:#f7f8ef}pre{white-space:pre-wrap;padding:16px}iframe{width:100%;height:900px;border:0}body.visual pre{display:none}body.visual iframe{height:100vh}</style><pre id="result">RUNNING</pre><iframe id="game" title="Permainan ujian"></iframe><script>
(async()=>{
const frame=document.querySelector('iframe'),out=document.querySelector('pre'),logs=[],errors=[];let w,d;

try{
 await load();w.localStorage.removeItem('labirin-pulau-v2');w.localStorage.removeItem('labirin-pulau-soalan-v2');await load();await w.Maze.assetsReady;
 const visual=new URLSearchParams(location.search).get('visual');if(visual){document.body.className='visual';if(visual.includes('mobile'))frame.style.width='390px';}
 check(!!$('#learn')&&!!$('#teacher-guide')&&$('#start').textContent.includes('Mula Bermain'),'Large learning, teacher and play buttons present');
 check(!$('#resume'),'Resume hidden until a profile exists');check(!!$('[data-volume]'),'Volume control visible at home');

 const img=$('[data-material-image]');img.dispatchEvent(new w.Event('error'));check(img.hidden&&!$('.material-fallback').hidden,'Image load failure displays educational SVG fallback');

 const originalRecording=w.Voice.recording,originalVoice=w.Voice.malayVoice;w.Voice.recording=async()=>false;w.Voice.malayVoice=()=>undefined;await w.Voice.speak('Teks suntingan yang tiada rakaman');check(!w.Voice.playing&&w.Voice.status.includes('Tiada rakaman'),'Unavailable Malay voice reports text fallback without other language');w.Voice.recording=originalRecording;w.Voice.malayVoice=originalVoice;
 click('#material-next');const baseline=JSON.stringify(snap().state.records);click('[data-option="1"]');click('#confirm-answer');check(!!$('#wrong-reading'),'Practice gives wrong-answer explanation');click('#confirm-answer');click('[data-option="0"]');click('#confirm-answer');click('#confirm-answer');check(JSON.stringify(snap().state.records)===baseline&&snap().state.stars===0,'Learning practice changes no score or response records');
 for(let i=0;i<6;i++){check($('#guide-reading').textContent.includes(w.LEARNING.guide[i].text),'Illustrated guide step '+(i+1));if(i<5)click('#guide-next');}click('#guide-repeat');check($('#guide-reading').textContent.startsWith('1.'),'Guide can restart');click('#guide-understood');

 click('#start');$('[name=nickname]').value='Uji';$('[name=classroom]').value='2 Aman';click('[name=playmode][value=self]');$('#control-choice').value='pad';$('#control-choice').dispatchEvent(new w.Event('change'));check($('#control-description').textContent===w.LEARNING.controls.pad,'Control demonstration describes selected pad');$('#profile-form').requestSubmit();click('#story-go');click('#material-next');click('#material-next');click('#material-next');click('[data-option="0"]');click('#confirm-answer');click('#confirm-answer');check($('#guide-controls')===null,'Guide starts at first step');click('#guide-next');check($('#guide-controls').textContent===w.LEARNING.controls.pad,'Guide adapts to selected pad');click('#guide-practice');
 let game=w.PulauDebug.world();check(snap().tutorialStep===0,'Interactive practice starts');const walk=(target)=>{game.route=w.Maze.path(game.map.grid,[Math.floor(game.player.x/64),Math.floor(game.player.y/64)],target,game.blocked());for(let i=0;i<2500&&game.route.length;i++){w.cancelAnimationFrame(game.frame);game.tick(game.last+35);w.cancelAnimationFrame(game.frame);}};walk(game.map.solution[4]);walk([game.map.stations[0].col,game.map.stations[0].row]);check(snap().tutorialStep===1,'Practice requires movement first');game.interact();check(game.paused&&game.keys.size===0,'Practice stops at question location');click('[data-option="0"]');click('#confirm-answer');click('#confirm-answer');click('#training-done');game=w.PulauDebug.world();check(snap().state.records.length===0&&snap().state.stars===0,'Interactive movement and sample answer are unscored');
 check(d.body.classList.contains('controls-pad')&&!$('.game-stage').contains($('.touch-controls')),'Pad is outside maze and cannot cover its paths');
 click('#pause');click('[name=playmode][value=class]');click('#continue');const t=game.nextTarget();walk([t.o.col,t.o.row]);game.interact();check(d.body.classList.contains('mode-class'),'Class mode applied');check(!$('.modal-close'),'Class question requires explicit teacher progression');check($('.material-figure figcaption').hidden&&!$('.material-figure').classList.contains('revealed'),'Question hides category label before answer');check(!$('#question-reading').textContent.toLowerCase().includes('tembakau'),'Identification question does not reveal tobacco category');

 click('#pause');click('[name=playmode][value=guided]');$('#control-choice').value='keyboard';$('#control-choice').dispatchEvent(new w.Event('change'));click('#continue');check(snap().state.settings.mode==='guided'&&!d.body.classList.contains('controls-pad'),'Guided mode and keyboard preference persist');click('#hint');check(snap().state.routeHints[0]===1,'Route hints recorded separately');
 click('#pause');click('#pause-guide');click('#guide-practice');game=w.PulauDebug.world();walk(game.map.solution[4]);walk([game.map.stations[0].col,game.map.stations[0].row]);game.interact();click('[data-option="0"]');click('#confirm-answer');click('#confirm-answer');click('#training-done');game=w.PulauDebug.world();check(game.progress.solved.includes(0)&&snap().state.records.length===1,'Repeating training preserves existing learning progress');
 click('#game-home');check(!!$('#resume'),'Resume button available after progress');await load();click('#resume');game=w.PulauDebug.world();check(game.progress.solved.includes(0)&&snap().state.settings.mode==='guided','Progress and mode survive reload');click('#game-home');click('#teacher');check($('.focus-summary').children.length===3,'Teacher summary groups three learning focuses');check($('.records tbody tr').textContent.includes('1'),'Teacher record includes first response, attempts and hints');close();
 frame.style.width='390px';click('#learn');await wait(50);check(d.documentElement.scrollWidth<=390,'Learning page fits phone width');check($('.material-picture').getBoundingClientRect().width>=180,'Phone illustration remains large');close();
 const context=new w.AudioContext();for(const [text,path] of Object.entries(w.MALAY_AUDIO)){const response=await fetch('../'+path);if(!response.ok)throw Error('Audio HTTP '+response.status+' '+path);const data=await context.decodeAudioData(await response.arrayBuffer());check(data.duration>.2,'Browser decodes MP3 '+path.split('/').pop());}await context.close();
 check(errors.length===0,'No JavaScript runtime errors: '+errors.join('; '));out.textContent='ALL PASSED\n'+logs.join('\n');document.body.dataset.result='passed';
}catch(e){out.textContent='FAILED\n'+logs.join('\n')+'\n'+e.stack;document.body.dataset.result='failed';}
})();</script></html>
