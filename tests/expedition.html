<!doctype html><html lang="ms"><meta charset="utf-8"><title>Ujian pulau dan pintu kod</title><style>body{margin:0;background:#edf4ec;font:13px monospace}pre{padding:16px;white-space:pre-wrap}iframe{width:100%;height:1000px;border:0}.visual pre{display:none}.visual iframe{height:100vh}</style><pre>RUNNING</pre><iframe title="Permainan ujian"></iframe><script>
(async()=>{
 const frame=document.querySelector('iframe'),out=document.querySelector('pre'),logs=[],errors=[];let w,d,world;
 const check=(v,t)=>{if(!v)throw Error(t);logs.push('PASS '+t);out.textContent=logs.join('\n');};
 const load=()=>new Promise(resolve=>{const destination=new URL('../index.html?t='+Date.now()+'-'+Math.random(),location.href).href;frame.onload=()=>{const ready=()=>{if(frame.contentWindow.location.href===destination&&frame.contentWindow.PulauDebug){w=frame.contentWindow;d=w.document;w.addEventListener('error',e=>errors.push(e.message));resolve();}else setTimeout(ready,20);};ready();};frame.src=destination;});
 const $=s=>d.querySelector(s),click=s=>{const el=$(s);if(!el||el.disabled)throw Error('Missing or disabled '+s);el.click();},close=()=>$('.modal-close')?.click(),snap=()=>w.PulauDebug.snapshot().state;
 const walk=route=>{w.cancelAnimationFrame(world.frame);world.route=route.slice();for(let i=0;i<12000&&world.route.length;i++)world.step(.035);check(!world.route.length,'Physical movement reaches its destination without crossing a wall');world.draw();};
 const target=()=>{world=w.PulauDebug.world();const t=world.nextTarget();check(t.route.length>0,'Next mandatory object is reachable with current doors');walk(t.route);world.interact();return t.o;};
 const next=()=>{if($('#mechanic-continue'))click('#mechanic-continue');world=w.PulauDebug.world();};
 const visual=new URLSearchParams(location.search).get('visual');
 const capture=()=>{document.body.className='visual';if(visual?.includes('mobile'))frame.style.width='390px';document.body.dataset.result='visual';};
 try{
  localStorage.removeItem('labirin-pulau-v2');localStorage.removeItem('pulau-set-counter');await load();await w.Maze.assetsReady;
  check(w.PulauDebug.questions().length===12,'A session contains twelve main station questions');
  const prompts=[];for(let v=0;v<3;v++){
   const base=w.EXPEDITION.bank[v];check(base.length===12&&[0,1,2].every(n=>base.filter(q=>q.level===n).length===4),'Every bank set has four objectives on every map');check(new Set(base.map(q=>q.prompt)).size===12,'No duplicate main prompt within set '+v);prompts.push(...base.map(q=>q.prompt));
   for(const q of base)check(q.mechanic==='sequence'||q.options.length<=3&&new Set(q.options).size===q.options.length&&!!q.options[q.answer],'Unique plausible option slots and valid answer: '+q.id+' / '+v);
   for(let seed=1;seed<=40;seed++){const qs=w.EXPEDITION.makeSet(v,seed),answers=qs.filter(q=>q.mechanic!=='sequence').map(q=>q.answer),counts=[0,1,2].map(n=>answers.filter(a=>a===n).length);if(Math.max(...counts)-Math.min(...counts)>1||answers.some((a,i)=>i>1&&a===answers[i-1]&&a===answers[i-2]))throw Error('Answer balance failed '+v+'/'+seed);for(let i=0;i<qs.length;i++){const q=qs[i];if(q.mechanic!=='sequence'&&q.options[q.answer]!==base[i].options[base[i].answer])throw Error('Shuffle changed meaning');}}check(true,'Forty seeds preserve balanced A/B/C, no run of three, and exact answer meaning');
  }check(new Set(prompts).size>12,'Reviewed bank is larger than one session');
  for(let n=0;n<3;n++){const map=w.Maze.generate(n),blocked=new Set(map.doors.map(o=>o.col+','+o.row));check(map.stations.length===4&&map.doors.length===4,'Four stations each have a corresponding gate on map '+n);check(map.regions.length===4&&new Set(map.stations.map(o=>(o.col>12?'R':'L')+(o.row>10?'B':'T'))).size===4,'Stations span all four map quadrants');check(map.scenery.filter(s=>s.kind==='palm').length<=4,'Palm trees are sparse decorations, not maze walls');check(map.scenery.every(s=>s.cells.every(([x,y])=>map.grid[y][x]===1)),'Solid scenery footprints match collision geometry');
   let at=map.start;for(let i=0;i<4;i++){const station=map.stations[i],door=map.doors[i];check(w.Maze.path(map.grid,at,[station.col,station.row],blocked).length>0,'Station '+i+' reachable in sequence');const future=map.stations[i+1]||{col:map.exit[0],row:map.exit[1]};check(!w.Maze.path(map.grid,at,[future.col,future.row],blocked).length,'Closed gate prevents bypass to next zone');blocked.delete(door.col+','+door.row);at=[door.col,door.row];}check(w.Maze.path(map.grid,at,map.exit,blocked).length>0,'Exit reachable after all code gates');
  }
  click('#start');$('[name=nickname]').value='Nabilah';$('[name=classroom]').value='2 Ceria';click('[data-character=Aini]');click('[name=playmode][value=self]');$('#profile-form').requestSubmit();click('#story-go');for(let i=0;i<3;i++)click('#material-next');click('[data-option="0"]');click('#confirm-answer');click('#confirm-answer');click('#guide-understood');world=w.PulauDebug.world();walk(world.map.solution.slice(0,5));check(w.PulauDebug.snapshot().tutorialStep===1,'Short movement practice progresses');walk(w.Maze.path(world.map.grid,[Math.floor(world.player.x/64),Math.floor(world.player.y/64)],[world.map.stations[0].col,world.map.stations[0].row]));world.interact();click('[data-option="0"]');click('#confirm-answer');click('#confirm-answer');click('#training-done');next();check(snap().records.length===0,'Training and story do not count as main assessment');
  const sessionQuestions=JSON.stringify(snap().questionSet);const answered=new Set();
  for(let n=0;n<3;n++){
   world=w.PulauDebug.world();if(visual==='map'+n){click('#island-view');world.draw();capture();return;}
   for(let i=0;i<4;i++){
    const object=target();check(object.order===i&&object.type!=='door','Main activity appears at its own station');const q=snap().questionSet.filter(q=>q.level===n)[i];check(!answered.has(q.prompt),'Main question has not appeared earlier in this session');answered.add(q.prompt);check(world.paused,'Question stops maze control');
    if(q.mechanic==='sequence'){if($('#sequence-start'))click('#sequence-start');for(const j of [2,0,1])click('[data-order-card="'+j+'"]');click('#confirm-order');check(!world.progress.solved.includes(i),'Wrong sequence gives help without granting a code');click('#clear-order');for(const j of [0,1,2]){const transfer=new w.DataTransfer();$('[data-order-card="'+j+'"]').dispatchEvent(new w.DragEvent('dragstart',{bubbles:true,dataTransfer:transfer}));$('[data-drop="'+j+'"]').dispatchEvent(new w.DragEvent('drop',{bubbles:true,dataTransfer:transfer}));}click('#confirm-order');click('#confirm-order');}
    else{if(q.mechanic==='sort'){check(!!$('#evidence-card'),'Evidence uses draggable/tappable card');if(visual==='sort-mobile'){capture();return;}click('#evidence-card');}
     if(n===0&&i===0){click('[data-option="'+((q.answer+1)%3)+'"]');click('#confirm-answer');check(!world.progress.solved.includes(i),'Wrong answer keeps station incomplete');click('#confirm-answer');check($('#question-reading').textContent.endsWith(q.prompt),'Retry keeps the selected session question');}
     if(q.mechanic==='truth')check(d.querySelectorAll('[data-option]').length===2,'True/false uses only two clear choices');click('[data-option="'+q.answer+'"]');click('#confirm-answer');check(!!$('#feedback-reading')&&$('#feedback-reading').textContent===q.explanation,'Feedback explains the actual shuffled answer');if(q.character==='Aini')check($('.material-figure figcaption').hidden,'Unknown package is not labelled as confirmed drugs');const btn=$('#confirm-answer');btn.click();const stars=snap().stars;btn.click();check(snap().stars===stars,'Repeated continue cannot grant duplicate learning rewards');}
    const door=w.EXPEDITION.door(n,i);check(!!$('#code-continue')&&$('.code-card strong').textContent===door.code,'Station awards the correct two-digit card');check(snap().expedition.codes[door.id]===door.code,'Code is saved under its matching gate identity');check(snap().levels[n].solved.includes(i)&&!!snap().levels[n].position,'Station checkpoint and learning completion saved');if(visual==='card-mobile'){capture();return;}click('#code-continue');
    const gate=target();check(gate.type==='door'&&gate.order===i,'Hint goes from solved station to matching code gate');if(visual==='gate-mobile'){capture();return;}const before=snap().records.length;$('#code-input').value='00';$('#code-form').requestSubmit();check($('#gate-feedback').textContent===w.EXPEDITION.messages.wrong,'Wrong code gives the requested calm retry message');check(snap().records.length===before&&!snap().levels[n].doors.includes(i),'Wrong code does not alter learning or gate progress');
    click('#gate-book');check($('[data-book-code="'+door.id+'"] b').textContent===door.code,'Book supplies the gate code without memorisation');check(snap().expedition.digits.filter(x=>x!==null).length===n,'Treasure digit remains unavailable until all four gates are open');if(visual==='book-mobile'){capture();return;}click('#close-book');check(!!$('#code-input'),'Closing the book returns to the same keypad');
    if(n===0&&i===0){$('#code-input').value='x2y4z';$('#code-input').dispatchEvent(new w.Event('input'));check($('#code-input').value==='24','Keyboard input removes non-digits');$('#code-input').value='';for(const digit of door.code)click('[data-code-number="'+digit+'"]');click('#check-code');}else{$('#code-input').value=door.code;$('#code-form').requestSubmit();}
    check(snap().levels[n].doors.includes(i),'Correct keypad code opens the matching gate');check(snap().records.length===before,'Entering a code is not counted as a question');
    if(i===3){check($('#digit-reading').textContent===w.EXPEDITION.digitText(n),'Completing four gates grants the correctly ordered treasure digit');check(snap().expedition.digits[n]===w.EXPEDITION.digits[n],'Treasure digit saved in its numbered map slot');click('#digit-continue');}
    if(n===0&&i===0){click('#game-home');await load();check(JSON.stringify(snap().questionSet)===sessionQuestions,'Question selection and option order persist across resume');click('#resume');next();check(snap().levels[0].doors.includes(0)&&snap().expedition.codes[door.id]===door.code,'Opened gate and card survive resume');}
   }
   check(snap().records.filter(r=>r.level===n).length===4,'Map '+n+' has exactly four assessed main questions');const exit=target();check(exit.type==='exit','All gates lead to the map exit or treasure');
   if(n<2){click('#story-continue');click('#next-level');if($('#skip-cosmetic'))click('#skip-cosmetic');next();}
  }
  check(snap().records.length===12&&answered.size===12,'Twelve distinct main questions completed before final treasure');check(snap().expedition.digits.join('')==='472','Final three-digit code is complete only after every map');check(!snap().expedition.opened,'Treasure stays closed before code confirmation');$('#code-input').value='999';$('#code-form').requestSubmit();check($('#gate-feedback').textContent===w.EXPEDITION.messages.wrongTreasure,'Wrong treasure code preserves progress and offers notebook help');click('#gate-book');check([...d.querySelectorAll('.treasure-digits strong')].map(e=>e.textContent).join('')==='472','Treasure notebook presents ordered digits separately from door cards');click('#close-book');for(const digit of '472')click('[data-code-number="'+digit+'"]');click('#check-code');check(snap().expedition.opened&&!!$('#treasure-continue'),'Correct collected code opens final treasure');if(visual==='treasure'){capture();return;}click('#skip-treasure');check($('.treasure-reveal').classList.contains('animation-finished'),'Treasure animation can be skipped immediately');
  await load();click('#resume');check(!!$('#story-continue'),'Resume after opening chest still offers pending rewards');click('#story-continue');click('#next-level');click('[data-cosmetic=hat]');click('#confirm-cosmetic');check(!!$('#preview-certificate')&&!!$('#read-summary'),'Treasure leads to accessory, certificate and illustrated spoken summary');check(snap().campaign.unlocked.includes('hat')&&snap().stars<=120,'Cosmetic reward does not change learning score');click('#preview-certificate');await $('.certificate-preview').decode();check($('.certificate-preview').naturalWidth===1400,'Existing certificate still renders with embedded portraits');if(visual==='certificate'){capture();return;}close();click('#game-home');await load();click('#resume');check(!!$('#preview-certificate'),'Completed treasure ending resumes without repeating questions or code');
  close();click('#teacher');check($('.records tbody').children.length===12,'Teacher sees twelve main responses, not code attempts');const idx=snap().questionSet.findIndex(q=>q.mechanic==='truth');$('#edit-question').value=idx;$('#edit-question').dispatchEvent(new w.Event('change'));check($('#edit-option-2').closest('label').hidden&&!$('#edit-option-2').required,'Teacher editor supports true/false without a fake third choice');$('#edit-hint').value='Petunjuk guru yang disimpan.';$('#editor-form').requestSubmit();check(snap().questionSet[idx].hint==='Petunjuk guru yang disimpan.','Teacher changes persist with the active session');close();
  for(const q of snap().questionSet.filter(q=>!q.teacherEdited)){check(!!w.MALAY_AUDIO['Soalan '+(q.order+1)+'. '+q.prompt],'Current question has matching numbered audio');if(q.mechanic!=='sequence')q.options.forEach((text,i)=>check(!!w.MALAY_AUDIO['Pilihan '+['A','B','C'][i]+'. '+text],'Shuffled option and spoken letter match'));}
  const finished=snap(),legacy=JSON.parse(JSON.stringify(finished));delete legacy.expedition;legacy.questionSet=legacy.questionSet.filter(q=>q.order<3);legacy.levels.forEach(p=>{p.solved=[0,1,2];p.doors=[0,1,2];});legacy.completed=[0,1,2];legacy.level=2;const oldRecords=JSON.stringify(legacy.records),oldCollection=JSON.stringify(legacy.campaign.unlocked);await new Promise(resolve=>{frame.onload=resolve;frame.src='about:blank';});localStorage.setItem('labirin-pulau-v2',JSON.stringify(legacy));await load();check(snap().expedition.migrated&&snap().questionSet.length===12,'Old nine-question session migrates to twelve stations');check(JSON.stringify(snap().records)===oldRecords&&JSON.stringify(snap().campaign.unlocked)===oldCollection,'Migration retains responses and earned collection');check(snap().levels.every(p=>p.solved.length===3&&p.doors.length===3),'Already completed stations and opened doors survive migration');check(Object.keys(snap().expedition.codes).length===9&&snap().expedition.digits.every(x=>x===null),'Legacy solved stations receive matching cards without premature treasure digits');check(snap().level===0&&!snap().completed.length,'Resume returns to the first map with an unfinished fourth station');click('#resume');next();world=w.PulauDebug.world();check(world.nextTarget().o.order===3,'Migrated session targets the new fourth station without repeating old questions');click('#game-home');await new Promise(resolve=>{frame.onload=resolve;frame.src='about:blank';});localStorage.setItem('labirin-pulau-v2',JSON.stringify(finished));await load();
  check(errors.length===0,'No JavaScript runtime errors: '+errors.join('; '));out.textContent='ALL PASSED\n'+logs.join('\n');document.body.dataset.result='passed';
 }catch(e){out.textContent='FAILED\n'+logs.join('\n')+'\n'+e.stack;document.body.dataset.result='failed';}
})();</script></html>
