<!doctype html><html lang="ms"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ujian ilustrasi soalan</title><style>body{margin:0;font:13px monospace}pre{padding:15px;white-space:pre-wrap}iframe{width:100%;height:950px;border:0}.visual pre{display:none}.visual iframe{height:100vh}</style><pre>RUNNING</pre><iframe title="Ujian gambar permainan"></iframe><script>
(async()=>{const saved=['pulau-cabaran-3d-v1','labirin-pulau-v2'].map(k=>[k,localStorage.getItem(k)]),restore=()=>saved.forEach(([k,v])=>v===null?localStorage.removeItem(k):localStorage.setItem(k,v));addEventListener('pagehide',restore);const frame=document.querySelector('iframe'),out=document.querySelector('pre'),logs=[],errors=[],visual=new URLSearchParams(location.search).get('visual');let w,d;const check=(v,t)=>{if(!v)throw Error(t);logs.push('PASS '+t);out.textContent=logs.join('\n');};const wait=ms=>new Promise(r=>setTimeout(r,ms));const load=()=>new Promise(resolve=>{frame.onload=()=>{const ready=()=>{if(frame.contentWindow.Pulau3D){w=frame.contentWindow;d=w.document;w.addEventListener('error',e=>errors.push(e.message));w.cancelAnimationFrame(w.Pulau3D.world().frame);resolve();}else setTimeout(ready,30);};ready();};frame.src='../index.html?scene-test='+Date.now();});const $=s=>d.querySelector(s),click=s=>$(s).click();const show=q=>{w.Progress.state.answers={};for(const prev of w.Progress.state.questions.filter(x=>x.station===q.station)){if(prev.id===q.id)break;w.Progress.state.answers[prev.id]={done:true};}w.Pulau3D.enterStation(q.station);};
try{localStorage.removeItem('pulau-cabaran-3d-v1');localStorage.removeItem('labirin-pulau-v2');await load();w.Progress.state.profile={name:'Ujian Gambar',classroom:'2 Ceria'};w.Progress.state.training=true;w.Progress.state.demos=[0,1,2];w.Progress.state.settings.voiceEnabled=false;w.Progress.save();w.Pulau3D.start();w.cancelAnimationFrame(w.Pulau3D.world().frame);check(Object.keys(w.QuestionScenes.items).length===14,'Fourteen human-scene assets registered');const original=JSON.stringify(w.Progress.state.questions);
for(const q of w.Progress.state.questions){if(visual&&q.id!==visual)continue;show(q);const pictures=[...d.querySelectorAll('#modal-root .scene-photo')];check(pictures.length===(q.type==='match'?3:1),'People illustrated in '+q.id);for(const img of pictures){await img.decode();check(img.naturalWidth===1536&&img.naturalHeight===1024,'Scene loads with original proportions: '+img.getAttribute('src'));check(img.alt.length>35,'Meaningful Malay image description');}check(w.Pulau3D.world().paused,'Maze remains paused while viewing '+q.id);if(visual===q.id){document.body.className='visual';await wait(200);document.body.dataset.result='visual';return;}const record=JSON.stringify(w.Progress.state.records);await new Promise(r=>w.requestAnimationFrame(()=>w.requestAnimationFrame(r)));const open=$('[data-scene-open]');open.focus();open.click();check($('#scene-viewer').open,'Image enlargement opens for '+q.id);check($('#scene-viewer img').src===pictures[0].src,'Enlargement retains the same scene');click('#close-scene');await wait(40);check(!$('#scene-viewer').open&&d.activeElement===open,'Close restores question focus: '+d.activeElement.tagName);check(JSON.stringify(w.Progress.state.records)===record,'Viewing image does not change responses or rewards');click('#leave-station');}
check(JSON.stringify(w.Progress.state.questions)===original,'Questions, answers and saved question bank unchanged');
const q=w.Progress.state.questions[8];show(q);const img=$('.scene-photo');await img.decode();img.dispatchEvent(new w.Event('error'));check(img.hidden&&!$('.scene-fallback').hidden,'Image failure shows a descriptive text fallback');check(!$('#modal-root svg'),'No ambiguous geometric people replace failed question scene');for(const i of [0,1,2,3])click('[data-phrase="'+i+'"]');click('#check-answer');check(w.Progress.state.answers[q.id].done,'Activity still completes after image failure');
// A saved pre-update question still uses the new mapping without rewriting its content.
click('#check-answer');click('#leave-station');const persisted=JSON.stringify(w.Progress.state.questions);await load();click('#resume');w.cancelAnimationFrame(w.Pulau3D.world().frame);w.Pulau3D.enterStation(2);check(!!$('.scene-photo'),'Saved session receives new illustration');check(JSON.stringify(w.Progress.state.questions)===persisted,'Saved question content survives artwork update');check(errors.length===0,'No JavaScript errors');document.body.dataset.result='passed';out.textContent='ALL PASSED\n'+logs.join('\n');}catch(e){document.body.dataset.result='failed';out.textContent='FAILED\n'+logs.join('\n')+'\n'+(e.stack||e);}finally{if(!visual){frame.remove();restore();}}})();</script></html>
