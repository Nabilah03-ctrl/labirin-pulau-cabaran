<!doctype html><html lang="ms"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ujian Pulau 3D</title><style>body{margin:0;background:#f3f5e9;font:13px monospace}pre{white-space:pre-wrap;padding:15px}iframe{width:100%;height:1000px;border:0}.visual pre{display:none}.visual iframe{height:100vh}</style><pre>RUNNING</pre><iframe title="Permainan ujian"></iframe><script>
(async()=>{const savedKeys=['pulau-cabaran-3d-v1','labirin-pulau-v2'].map(k=>[k,localStorage.getItem(k)]);const restore=()=>savedKeys.forEach(([k,v])=>v===null?localStorage.removeItem(k):localStorage.setItem(k,v));addEventListener('pagehide',restore);const frame=document.querySelector('iframe'),out=document.querySelector('pre'),logs=[],errors=[];let w,d;const check=(v,t)=>{if(!v)throw Error(t);logs.push('PASS '+t);out.textContent=logs.join('\n');};const wait=ms=>new Promise(r=>setTimeout(r,ms));const load=()=>new Promise(resolve=>{frame.onload=()=>{const ready=()=>{if(frame.contentWindow.Pulau3D){w=frame.contentWindow;d=w.document;w.addEventListener('error',e=>errors.push(e.message));resolve();}else setTimeout(ready,30);};ready();};frame.src='../index.html?test='+Date.now();});const $=s=>d.querySelector(s),click=s=>{const el=$(s);if(!el||el.disabled)throw Error('Missing or disabled '+s);el.click();},snap=()=>w.Pulau3D.snapshot();const visual=new URLSearchParams(location.search).get('visual'),capture=async()=>{document.body.className='visual';await wait(700);document.body.dataset.result='visual';};
try{localStorage.removeItem('pulau-cabaran-3d-v1');localStorage.removeItem('labirin-pulau-v2');await load();check(!!w.Pulau3D.world(),'Real WebGL world initializes');check(w.Pulau3D.world().renderer.isWebGLRenderer,'Three.js WebGLRenderer is active');check(w.Pulau3D.world().interactables.filter(o=>o.kind==='station').length===3,'Exactly three learning stations in one world');if(visual==='home'){await capture();return;}
click('#start');$('[name=nickname]').value='Nabilah';$('[name=classroom]').value='2 Ceria';$('#profile-form').requestSubmit();click('#story-next');for(let i=0;i<5;i++)click('#guide-next');check(!!$('#world'),'Guide leads to the playable island');if(visual==='world'){await capture();return;}

let world=w.Pulau3D.world();const travel=o=>{world=w.Pulau3D.world();const route=world.routeTo(...o.entry);check(route.length>0,'Destination has a valid collision-aware path: '+o.id);world.route=route;w.cancelAnimationFrame(world.frame);for(let k=0;k<16000&&world.route.length;k++)world.step(.04);check(!world.route.length,'Character physically follows path to '+o.id);world.render();};const object=id=>world.interactables.find(o=>o.id===id);
check(!world.routeTo(...object('station-1').entry).length,'River blocks workshop before the bridge is restored');check(!world.routeTo(...object('station-2').entry).length,'Northern area is locked before earlier stations');travel(object('training'));click('#interact');click('#training-done');check(snap().records.length===0&&snap().training,'Control practice is interactive and unscored');
check(!d.querySelector('[name=playmode]')&&!d.querySelector('[data-character]')&&!d.querySelector('#my-collection'),'Extra modes, character and accessory menus removed');const base=JSON.stringify(snap().questions);
for(let n=0;n<3;n++){
 travel(object('station-'+n));click('#interact');check(!!$('#demo-done')&&$('#demo-done').disabled,'New mechanic requires a short interactive demonstration');if(n===0){click('[data-demo-choice="0"]');click('#demo-check');}if(n===1){click('#demo-card');click('#demo-target');}if(n===2){click('[data-demo-phrase="0"]');click('[data-demo-phrase="1"]');}click('#demo-done');
 for(let i=0;i<4;i++){
  const q=snap().questions.filter(q=>q.station===n)[i];check(w.Pulau3D.world().paused,'Question pauses world movement');check($('#question-reading').textContent==='Soalan '+(i+1)+'. '+q.prompt,'Correct station question is presented');check(snap().digits[n]===null,'No code is granted after an individual question');

   check(d.querySelectorAll('[data-option]').length===3,'Multiple choice retains A/B/C');if(i===0){click('[data-option="0"]');click('#check-answer');check(!snap().answers[q.id].done&&$('#feedback').textContent.includes('Mari fikir semula'),'Wrong choice preserves retry');click('#question-hint');}
   click('[data-option="'+q.answer+'"]');click('#check-answer');
  }
  if(q.type==='match'){
   check(d.querySelectorAll('[data-card]').length===3&&d.querySelectorAll('[data-drop]').length===3,'Each matching question contains three cards and targets');
   if(visual==='match-mobile'){await capture();return;}
   if(i===0){for(const [card,target]of [[0,0],[1,2],[2,1]]){click('[data-card="'+card+'"]');click('[data-drop="'+target+'"]');}click('#check-answer');check(snap().answers[q.id].locked.join(',')==='0'&&$('[data-card="0"]').disabled,'Correct match is retained while wrong matches can be changed');click('#leave-station');click('#home');await load();click('#resume');world=w.Pulau3D.world();travel(object('station-1'));click('#interact');check(snap().answers[q.id].locked.includes(0)&&$('[data-card="0"]').disabled,'Partial correct matching survives save and reload');}
   for(let j=0;j<3;j++){if($('[data-card="'+j+'"]').disabled)continue;if(i%2===0){click('[data-card="'+j+'"]');click('[data-drop="'+j+'"]');}else{const transfer=new w.DataTransfer();$('[data-card="'+j+'"]').dispatchEvent(new w.DragEvent('dragstart',{bubbles:true,dataTransfer:transfer}));$('[data-drop="'+j+'"]').dispatchEvent(new w.DragEvent('drop',{bubbles:true,dataTransfer:transfer}));}}
   click('#check-answer');
  }
  if(q.type==='sentence'){
   check(d.querySelectorAll('[data-phrase]').length===5,'Sentence task has four correct phrases and one distractor');const target=q.cards.slice(0,4).join(' ');check(!$('.modal').textContent.includes(target),'Target sentence is not revealed before submission');
   if(visual==='sentence-mobile'){await capture();return;}
   if(i===0){for(const j of [0,4,2,3])click('[data-phrase="'+j+'"]');click('#check-answer');check(!snap().answers[q.id].done,'Unsafe distractor is rejected without losing other progress');click('#clear-sentence');}
   for(let j=0;j<4;j++){if(i%2===0)click('[data-phrase="'+j+'"]');else{const transfer=new w.DataTransfer();$('[data-phrase="'+j+'"]').dispatchEvent(new w.DragEvent('dragstart',{bubbles:true,dataTransfer:transfer}));$('[data-drop="'+j+'"]').dispatchEvent(new w.DragEvent('drop',{bubbles:true,dataTransfer:transfer}));}}
   click('#check-answer');check($('#correct-text').textContent.includes(target),'Submitted safe sentence receives its explanation');if(i===3)check($('#correct-text').textContent.includes('guru atau penjaga'),'Final sentence reinforces trusted adult help');
  }
  check(snap().answers[q.id].done,'Main question completes: '+q.id);const records=snap().records.length;const button=$('#check-answer');button.click();button.click();check(snap().records.length===records,'Repeated Continue cannot duplicate records or rewards');
 }
 check(snap().completed.includes(n)&&snap().digits[n]===w.LESSON.digits[n],'Exactly four questions grant one ordered digit');check(!!$('#story-next'),'Station completion advances the story');click('#story-skip');click('#story-next');click('#station-continue');world=w.Pulau3D.world();check(world.bridge.visible,'Bridge is restored after station one');if(n>=1)check(!world.gate.children[2].visible,'Tower passage opens after station two');if(n===2)check(world.beam.visible,'Lighthouse shines after station three');
 click('#code-book');check(d.querySelectorAll('.code-digits strong').length===3,'Code book contains only three treasure slots');click('#close-book');
}
check(snap().records.length===12,'Exactly twelve main responses, excluding demos and codes');check(JSON.stringify(snap().questions)===base,'Question content and order survive retries and reload');travel(object('treasure'));click('#interact');$('#code-input').value='000';$('#code-form').requestSubmit();check(!snap().opened&&$('#code-feedback').textContent===w.LESSON.messages.wrongCode,'Wrong final code offers help without deleting progress');if(visual==='code-mobile'){await capture();return;}click('#treasure-book');check([...d.querySelectorAll('.code-digits strong')].map(e=>e.textContent).join('')==='472','Notebook shows collected digits in correct order');click('#close-book');for(const digit of '472')click('[data-number="'+digit+'"]');$('#code-form').requestSubmit();check(snap().opened&&!!$('#ending-next'),'Collected code opens the real 3D chest');world=w.Pulau3D.world();for(let i=0;i<80;i++)world.render(.025);check(world.lid.rotation.x< -1.5,'Chest lid rotates around its hinge');if(visual==='treasure'){await capture();return;}click('#skip-chest');click('#ending-next');check(!!$('#certificate-preview')&&$('#summary-text').textContent===w.LESSON.messages.summary,'Treasure leads to illustrated spoken summary and certificate');click('#certificate-preview');await wait(250);await $('.certificate-preview').decode();check($('.certificate-preview').naturalWidth===1400,'Certificate preserves embedded detective portraits');if(visual==='certificate'){await capture();return;}click('#back-ending');click('#ending-home');await load();click('#resume');check(!!$('#certificate-preview')&&snap().records.length===12,'Completed ending resumes without repeating assessment');click('#ending-home');click('#teacher');check(d.querySelectorAll('.records tbody tr').length===12,'Teacher records retain twelve questions');check($('.records tbody tr').textContent.includes('Belum tepat'),'Teacher can distinguish first wrong answer from later success');let exported;const makeURL=w.URL.createObjectURL;w.URL.createObjectURL=b=>{exported=b;return makeURL.call(w.URL,b);};click('#export-csv');const csvText=await exported.text();check(csvText.includes('firstResponse')&&csvText.includes('response')&&csvText.includes('s1q1')&&csvText.includes('s3q4'),'Teacher CSV exports all original response fields');$('#edit-question').value='4';$('#edit-question').dispatchEvent(new w.Event('change'));check(d.querySelectorAll('[data-edit-target]').length===3,'Teacher can edit matching targets');$('#edit-question').value='8';$('#edit-question').dispatchEvent(new w.Event('change'));check(d.querySelectorAll('[data-edit-card]').length===5,'Teacher can edit sentence distractor');$('#edit-hint').value='Petunjuk guru untuk sesi ini.';$('#editor-form').requestSubmit();check(snap().questions[8].hint==='Petunjuk guru untuk sesi ini.','Teacher edit persists without changing station structure');click('.modal-close');
// Migration preserves the original storage and archives previous assessment instead of crediting different new activities.
const legacy={profile:{name:'Aini Lama',classroom:'2 Aman'},records:[{id:'kenali-1',attempts:2}],completed:[0,1,2],stars:120,levels:[{solved:[0,1,2,3],doors:[0,1,2,3]},{solved:[0,1,2,3],doors:[0,1,2,3]},{solved:[0,1,2,3],doors:[0,1,2,3]}],expedition:{opened:true},campaign:{unlocked:['hat']},settings:{volume:50}};await new Promise(resolve=>{frame.onload=resolve;frame.src='about:blank';});localStorage.removeItem('pulau-cabaran-3d-v1');localStorage.setItem('labirin-pulau-v2',JSON.stringify(legacy));await load();check(snap().profile.name==='Aini Lama'&&snap().legacy.stars===120&&snap().legacy.campaign.unlocked[0]==='hat','Legacy profile, full progress and collection preserved');check(localStorage.getItem('labirin-pulau-v2')===JSON.stringify(legacy),'Original save remains untouched');check(snap().questions.length===12&&snap().records.length===0,'New activities are not incorrectly marked as answered');click('#teacher');check(!!$('#legacy-certificate')&&!!$('#legacy-csv'),'Old achievement and responses remain accessible');let oldExport;const oldURL=w.URL.createObjectURL;w.URL.createObjectURL=b=>{oldExport=b;return oldURL.call(w.URL,b);};click('#legacy-csv');check((await oldExport.text()).includes('kenali-1'),'Legacy CSV retains original record identifier');click('.modal-close');

check(errors.length===0,'No runtime errors');document.body.dataset.result='passed';out.textContent='ALL PASSED\n'+logs.join('\n');}catch(e){document.body.dataset.result='failed';out.textContent='FAILED\n'+logs.join('\n')+'\n'+e.stack;}finally{if(!visual){frame.remove();restore();}}})();</script></html>
