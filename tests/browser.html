<!doctype html><html lang="ms"><meta charset="utf-8"><title>Semakan Labirin Pulau Cabaran</title><style>body{font:13px monospace;margin:0;background:#f4f7ed}pre{white-space:pre-wrap;padding:15px}iframe{width:100%;height:940px;border:0}body.visual pre{display:none}body.visual iframe{height:100vh;display:block}</style><pre id="result">RUNNING</pre><iframe id="game" title="Permainan ujian"></iframe><script>
(async()=>{
 const frame=document.getElementById('game'),out=document.getElementById('result'),log=[],errors=[];let w,d,game;
 const assert=(ok,msg)=>{if(!ok)throw Error(msg);log.push('PASS '+msg);out.textContent=log.join('\n');};
 const load=()=>new Promise(r=>{frame.onload=()=>{if(frame.contentWindow.location.pathname.endsWith('/index.html'))r();};frame.src='../index.html?maze-test='+Date.now();});
 const $=s=>d.querySelector(s),click=s=>{const el=$(s);if(!el)throw Error('Missing '+s);if(el.disabled)throw Error('Disabled '+s);el.click();};
 const snap=()=>w.PulauDebug.snapshot();
 const step=(n=1)=>{for(let i=0;i<n;i++){w.cancelAnimationFrame(game.frame);game.tick(game.last+35);w.cancelAnimationFrame(game.frame);}};
 const cell=()=>[Math.floor(game.player.x/64),Math.floor(game.player.y/64)];
 const go=(destination)=>{game.route=w.Maze.path(game.map.grid,cell(),destination,game.blocked());assert(game.route.length>0,'Target has reachable safe path');for(let i=0;i<2200&&game.route.length;i++)step();assert(!game.route.length,'Physical movement reaches target');};
 const toTarget=()=>{const target=game.nextTarget();assert(target.route.length>0,'Hint points to reachable mandatory target');game.showHint();assert(game.hintRoute.length===target.route.length,'Golden hint route follows correct path');game.route=target.route.slice();for(let i=0;i<2200&&game.route.length;i++)step();assert(!game.route.length,'Character follows hint without crossing walls');return target.o;};
 const downloads=()=>{const blobs=[];w.URL.createObjectURL=b=>{blobs.push(b);return 'blob:test';};w.URL.revokeObjectURL=()=>{};w.HTMLAnchorElement.prototype.click=function(){};return blobs;};
 const close=()=>$('.modal-close')?.click();
 try{
  await load();w=frame.contentWindow;d=w.document;w.addEventListener('error',e=>errors.push(e.message));assert(!!w.PulauDebug,'Application starts without error');await w.Maze.assetsReady;
  const visual=new URLSearchParams(location.search).get('visual');if(visual){document.body.classList.add('visual');if(visual.includes('mobile'))frame.style.width='390px';}
  if(visual==='home'||visual==='home-mobile'){document.body.dataset.result='visual';return;}
  assert(d.querySelectorAll('[data-level]').length===3,'Home shows three labyrinths');assert(w.PulauDebug.questions().length===9,'Nine learning questions available');
  for(let n=0;n<3;n++){const map=w.Maze.generate(n),blocked=new Set(map.hazards.map(o=>o.col+','+o.row));for(const s of [...map.stations,{col:map.exit[0],row:map.exit[1]}])assert(w.Maze.path(map.grid,map.start,[s.col,s.row],blocked).length>0,'Level '+(n+1)+' mandatory location has hazard-free route');assert(map.doors.length===(n===0?0:3),'Correct number of locked doors on level '+(n+1));const wallCount=map.grid.flat().filter(v=>v===1).length;assert(wallCount>map.cols,'Real maze walls and branches generated');}
  click('#start');if($('#confirm-reset'))click('#confirm-reset');$('[name=nickname]').value='Alya';$('[name=classroom]').value='2 Ceria';click('[data-character="Aini"]');$('#profile-form').requestSubmit();assert(!!$('#story-go'),'Opening story shown before maze');click('#story-go');click('#material-next');click('#material-next');click('#material-next');click('[data-option="0"]');click('#confirm-answer');click('#confirm-answer');click('#guide-understood');game=w.PulauDebug.world();assert(snap().tutorialStep===0,'Movement tutorial begins');
  const before={x:game.player.x,y:game.player.y};d.dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowLeft',bubbles:true}));step(30);d.dispatchEvent(new w.KeyboardEvent('keyup',{key:'ArrowLeft',bubbles:true}));assert(game.player.x>=64+12,'Wall prevents character leaving corridor');game.player.x=before.x;game.player.y=before.y;
  go(game.map.solution[4]);assert(snap().tutorialStep===1,'Walking advances tutorial');go([game.map.stations[0].col,game.map.stations[0].row]);d.dispatchEvent(new w.KeyboardEvent('keydown',{key:'e',bubbles:true}));click('[data-option="0"]');click('#confirm-answer');click('#confirm-answer');click('#training-done');game=w.PulauDebug.world();assert(snap().state.tutorial,'E interaction completes tutorial');
  if(visual){if(visual.includes('stage2')){click('#game-home');click('#teacher');$('#teacher-level').value='1';click('#teacher-play');game=w.PulauDebug.world();}game.resize();game.draw();game.frame=w.requestAnimationFrame(game.tick);document.body.dataset.result='visual';return;}
  click('#map');assert($('[data-map="1"]').disabled,'Later levels locked before completion');close();
  for(let n=0;n<3;n++){
   game=w.PulauDebug.world();for(let order=0;order<3;order++){
    const target=toTarget();assert(target.type!=='door'&&target.order===order,'Hint reaches correct question');game.interact();assert(snap().paused,'Question freezes player and obstacles');const time=game.time;step(25);assert(game.time===time,'Simulation remains frozen during reading');assert($('#confirm-answer').disabled,'Answer needs deliberate choice and confirmation');
    const q=w.PulauDebug.questions().filter(v=>v.level===n)[order];
    if(n===0&&order===0){click('[data-option="'+((q.answer+1)%3)+'"]');click('#confirm-answer');assert(!!$('#answer-feedback .try'),'Wrong answer gives guidance');assert(game.progress.solved.length===0,'Wrong answer cannot unlock progress');click('#confirm-answer');}
    click('[data-option="'+q.answer+'"]');click('#confirm-answer');assert(!!$('#answer-feedback .feedback'),'Correct answer explains learning');if(n===2)assert(!!$('.consequence'),'Safe action shows consequence');click('#confirm-answer');assert(game.progress.solved.includes(order),'Solved question saved');
    if(n>0){const door=toTarget();assert(door.type==='door'&&door.order===order,'Hint leads to locked door after receiving key');assert(!game.canStand(door.x,door.y),'Locked door blocks movement');game.interact();click('#unlock');assert(game.progress.doors.includes(order)&&game.canStand(door.x,door.y),'Key opens door and collision is removed');}
   }
   const exit=toTarget();assert(exit.type==='exit','After mandatory tasks hint points to exit');game.interact();assert(snap().state.completed.includes(n),'Exit completes level '+(n+1));assert(!!$('#celebration'),'Celebrating detective sprites displayed');click('#next-level');
  }
  assert(snap().state.completed.length===3,'All three levels completed');assert(snap().state.records.length===9,'All nine questions recorded');const first=snap().state.records[0];assert(first.attempts===2&&!first.firstCorrect&&first.correct,'First wrong response retained after retry');assert(!!$('#certificate'),'Final certificate available');let blobs=downloads();click('#certificate');const svg=await blobs[0].text();assert(svg.includes('Alya')&&svg.includes('2 Ceria'),'Certificate contains pupil name and class');
  const stars=snap().state.stars;await load();w=frame.contentWindow;d=w.document;assert(snap().state.completed.length===3&&snap().state.stars===stars,'Progress survives reload');click('#resume');assert(!!$('#certificate'),'Resume opens completed ending');close();click('#teacher');assert($('.records tbody').children.length===9,'Teacher sees nine response records');$('#edit-prompt').value='Suntingan guru: rokok berkaitan dengan bahan apa?';$('#editor-form').requestSubmit();assert(w.PulauDebug.questions()[0].prompt.startsWith('Suntingan guru'),'Teacher edits applied');blobs=downloads();click('#export-csv');const csv=await blobs[0].text();assert(csv.includes('Jawapan pertama')&&csv.includes('Alya')&&csv.split('\r\n').length===10,'CSV contains assessment fields and all responses');$('#teacher-level').value='1';click('#teacher-play');game=w.PulauDebug.world();assert(snap().level===1,'Teacher selects any maze level');
  const count=snap().state.records.length,attempts=snap().state.records[0].attempts;const hazard=game.map.hazards[0];game.player.x=hazard.x;game.player.y=hazard.y;step();assert(Math.hypot(game.player.x-game.checkpoint.x,game.player.y-game.checkpoint.y)<1,'Hazard restores checkpoint');assert(snap().state.records.length===count&&snap().state.records[0].attempts===attempts,'Movement mistakes leave learning records intact');
  click('#pause');if(!$('#setting-reduced').checked)click('#setting-reduced');assert(d.body.classList.contains('reduced'),'Reduced motion setting works');click('#continue');assert(!game.paused,'Pause resumes gameplay');
  click('#pause');$('#control-choice').value='pad';$('#control-choice').dispatchEvent(new w.Event('change'));click('#continue');frame.style.width='390px';await new Promise(r=>setTimeout(r,100));game.resize();game.camera();game.draw();assert(d.documentElement.scrollWidth<=390,'Mobile game fits screen');const px=game.player.x*game.scale+game.ox;assert(px>0&&px<390,'Mobile camera keeps detective visible');assert($('#touch-act').getBoundingClientRect().width>=44,'Touch interaction button is large enough');
  const direction=game.map.grid[1][2]===0?'arrowright':'arrowdown',button=$('[data-move='+direction+']');button.setPointerCapture=()=>{};const x=game.player.x,y=game.player.y;button.dispatchEvent(new w.PointerEvent('pointerdown',{pointerId:2,bubbles:true}));step(4);button.dispatchEvent(new w.PointerEvent('pointerup',{pointerId:2,bubbles:true}));assert(Math.hypot(game.player.x-x,game.player.y-y)>0,'Touch pad moves detective');assert(!game.keys.has(direction),'Releasing touch stops movement');
  click('#game-home');assert(d.documentElement.scrollWidth<=390,'Mobile landing page fits screen');click('#start');click('#confirm-reset');assert($('#profile-form')&&$('.modal').getBoundingClientRect().width<=390,'Character selection fits mobile');close();assert(errors.length===0,'No runtime errors: '+errors.join('; '));out.textContent='ALL PASSED\n'+log.join('\n');document.body.dataset.result='passed';
 }catch(e){out.textContent='FAILED\n'+log.join('\n')+'\n'+e.stack;document.body.dataset.result='failed';}
})();
</script></html>
